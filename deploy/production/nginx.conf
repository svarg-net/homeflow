# homeflow/deploy/production/nginx.conf
upstream laravel_octane {
    server app:8000;
}

upstream laravel_reverb {
    server app:8080;
}

server {
    listen 80;
    server_name your-domain.com; # Заменить на реальный домен

    # Раздача статики Vue-приложения (если Nginx раздает и фронтенд)
    root /var/www/frontend-desktop/dist;
    index index.html;

    # API и WebSockets проксируются на бэкенд
    location /api/ {
        proxy_pass http://laravel_octane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket соединения для Laravel Reverb
    location /app/ {
        proxy_pass http://laravel_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback для SPA (Vue)
    location / {
        try_files $uri $uri/ /index.html;
    }
}