# homeflow/deploy/production/docker-compose.prod.yml
services:
  app:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod # (можно использовать тот же Dockerfile, но с ARG APP_ENV=production)
    container_name: homeflow_prod_app
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "8000:8000"
      - "8080:8080"
    depends_on:
      - db
      - redis
    networks:
      - homeflow_prod_network

  queue:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: homeflow_prod_queue
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=512
    environment:
      - APP_ENV=production
    depends_on:
      - db
      - redis
    networks:
      - homeflow_prod_network

  db:
    image: postgres:18-alpine
    container_name: homeflow_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    networks:
      - homeflow_prod_network

  redis:
    image: redis:8-alpine
    container_name: homeflow_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - prod_redisdata:/data
    networks:
      - homeflow_prod_network

volumes:
  prod_pgdata:
  prod_redisdata:

networks:
  homeflow_prod_network:
    driver: bridge